<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간의 상자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --surface:#14213D;
    --surface-2:#1B2C4D;
    --gold:#E3B23C;
    --gold-dim:#8A6E28;
    --teal:#3A9188;
    --ink:#F1EAD9;
    --ink-dim:#A9AEC4;
    --danger:#C1543C;
    --radius:16px;
    --rarity-common:#9AA3B2;
    --rarity-rare:#4C8CF0;
    --rarity-epic:#B15CF0;
    --rarity-legendary:#E3B23C;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:var(--radius);
    padding:40px 32px;
    border:1px solid #22335C;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 6px;
    text-align:center;
  }
  .subtitle{
    color:var(--ink-dim);
    font-size:14px;
    text-align:center;
    margin:0 0 32px;
    line-height:1.6;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--ink-dim);
    margin:0 0 6px;
  }
  input{
    width:100%;
    padding:12px 14px;
    background:var(--surface-2);
    border:1px solid #2C3F6B;
    border-radius:10px;
    color:var(--ink);
    font-size:15px;
    font-family:inherit;
    margin-bottom:16px;
  }
  input:focus{
    outline:none;
    border-color:var(--gold-dim);
  }
  button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--gold);
    color:#1A1305;
  }
  .btn-primary:hover{ background:#eebd52; }
  .btn-primary:disabled{
    background:#5C5030;
    color:#8A8266;
    cursor:not-allowed;
  }
  .switch-line{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    color:var(--ink-dim);
  }
  .switch-line button{
    all:unset;
    color:var(--teal);
    cursor:pointer;
    font-weight:600;
  }
  .error-msg{
    background:rgba(193,84,60,0.15);
    border:1px solid var(--danger);
    color:#F3B4A6;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:16px;
    display:none;
  }
  .hidden{ display:none !important; }

  /* 게임 화면 */
  #gameScreen .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
  }
  #gameScreen .greeting{
    font-size:14px;
    color:var(--ink-dim);
  }
  #gameScreen .greeting strong{ color:var(--ink); }
  #logoutBtn{
    all:unset;
    color:var(--ink-dim);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
  }
  .chest-wrap{
    display:flex;
    justify-content:center;
    margin:8px 0 24px;
  }
  .chest{
    width:140px;
    height:110px;
    cursor:pointer;
    position:relative;
  }
  .chest-body{
    position:absolute;
    bottom:0;
    width:140px;
    height:70px;
    background:linear-gradient(180deg, #6B4A2A, #4A3018);
    border-radius:0 0 10px 10px;
    border:3px solid #2E1D0C;
  }
  .chest-lid{
    position:absolute;
    top:0;
    width:140px;
    height:50px;
    background:linear-gradient(180deg, #7C5732, #5A3D1F);
    border-radius:10px 10px 4px 4px;
    border:3px solid #2E1D0C;
    transform-origin:bottom;
    transition:transform 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .chest.open .chest-lid{
    transform:rotateX(115deg);
  }
  .chest-lock{
    position:absolute;
    top:44px;
    left:50%;
    transform:translateX(-50%);
    width:20px;
    height:20px;
    background:var(--gold);
    border-radius:4px;
    border:2px solid #2E1D0C;
    z-index:2;
  }
  .chest-glow{
    position:absolute;
    top:-30px;
    left:50%;
    transform:translateX(-50%) scale(0);
    width:80px;
    height:80px;
    background:radial-gradient(circle, rgba(227,178,60,0.7), transparent 70%);
    opacity:0;
    transition:opacity 0.3s, transform 0.3s;
  }
  .chest.open .chest-glow{
    opacity:1;
    transform:translateX(-50%) scale(1.4);
  }
  .status-text{
    text-align:center;
    font-size:14px;
    color:var(--ink-dim);
    min-height:20px;
    margin-bottom:24px;
  }
  .status-text.ready{ color:var(--teal); }
  .timer{
    font-family:'Fraunces', serif;
    font-size:22px;
    color:var(--gold);
  }
  .result-box{
    background:var(--surface-2);
    border:1px solid #2C3F6B;
    border-radius:12px;
    padding:16px;
    text-align:center;
    margin-bottom:20px;
    display:none;
  }
  .result-box .treasure-name{
    font-family:'Fraunces', serif;
    font-size:20px;
    color:var(--gold);
    margin-bottom:2px;
  }
  .stats-row{
    display:flex;
    justify-content:space-between;
    padding-top:20px;
    border-top:1px solid #22335C;
    font-size:14px;
  }
  .stats-row .label{ color:var(--ink-dim); }
  .stats-row .value{
    font-family:'Fraunces', serif;
    color:var(--gold);
    font-size:18px;
  }

  /* 등급 뱃지 (결과창에 표시) */
  .rarity-badge{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:8px;
  }
  .rarity-badge.common{ background:rgba(154,163,178,0.2); color:var(--rarity-common); }
  .rarity-badge.rare{ background:rgba(76,140,240,0.2); color:var(--rarity-rare); }
  .rarity-badge.epic{ background:rgba(177,92,240,0.2); color:var(--rarity-epic); }
  .rarity-badge.legendary{ background:rgba(227,178,60,0.2); color:var(--rarity-legendary); }

  /* 도감 열기 링크 */
  .collection-link{
    display:block;
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:var(--ink-dim);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    width:100%;
    font-family:inherit;
  }

  /* 도감 화면 */
  #collectionScreen .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }
  #backToGameBtn{
    all:unset;
    color:var(--ink-dim);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
  }
  .collection-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .item-card{
    background:var(--surface-2);
    border-radius:12px;
    padding:14px 8px;
    text-align:center;
    border:2px solid transparent;
  }
  .item-card.locked{
    opacity:0.4;
  }
  .item-card .item-emoji{
    font-size:28px;
    display:block;
    margin-bottom:6px;
  }
  .item-card .item-name{
    font-size:11px;
    color:var(--ink);
    line-height:1.3;
    min-height:28px;
  }
  .item-card .item-count{
    font-size:11px;
    color:var(--gold);
    margin-top:4px;
    font-weight:600;
  }
  .item-card.common{ border-color:rgba(154,163,178,0.4); }
  .item-card.rare{ border-color:rgba(76,140,240,0.4); }
  .item-card.epic{ border-color:rgba(177,92,240,0.4); }
  .item-card.legendary{ border-color:rgba(227,178,60,0.5); }
  .craft-btn{
    margin-top:8px;
    padding:6px;
    font-size:11px;
    background:var(--teal);
    color:#0B1220;
    border-radius:8px;
  }
  .craft-btn:disabled{
    background:#2C3F6B;
    color:var(--ink-dim);
    cursor:not-allowed;
  }
  .craft-result{
    background:var(--surface-2);
    border:1px solid #2C3F6B;
    border-radius:12px;
    padding:14px;
    text-align:center;
    margin-bottom:16px;
    display:none;
    font-size:13px;
  }
  .craft-result .arrow{ color:var(--ink-dim); margin:0 6px; }
</style>
</head>
<body>

  <!-- 로그인 / 회원가입 화면 -->
  <div class="card" id="authScreen">
    <h1>시간의 상자</h1>
    <p class="subtitle">한 시간에 한 번, 상자를 열어 보물을 모으세요</p>

    <div class="error-msg" id="authError"></div>

    <!-- 로그인 폼 -->
    <form id="loginForm">
      <label for="loginEmail">이메일</label>
      <input type="email" id="loginEmail" required>
      <label for="loginPassword">비밀번호</label>
      <input type="password" id="loginPassword" required>
      <button type="submit" class="btn-primary">로그인</button>
    </form>

    <!-- 회원가입 폼 -->
    <form id="signupForm" class="hidden">
      <label for="signupNickname">닉네임</label>
      <input type="text" id="signupNickname" required>
      <label for="signupEmail">이메일</label>
      <input type="email" id="signupEmail" required>
      <label for="signupPassword">비밀번호 (8자 이상)</label>
      <input type="password" id="signupPassword" minlength="8" required>
      <button type="submit" class="btn-primary">회원가입</button>
    </form>

    <div class="switch-line">
      <span id="switchToSignupLine">계정이 없으신가요? <button id="switchToSignup">회원가입</button></span>
      <span id="switchToLoginLine" class="hidden">이미 계정이 있으신가요? <button id="switchToLogin">로그인</button></span>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div class="card hidden" id="gameScreen">
    <div class="top-row">
      <div class="greeting">안녕하세요, <strong id="userNickname"></strong>님</div>
      <button id="logoutBtn">로그아웃</button>
    </div>

    <div class="chest-wrap">
      <div class="chest" id="chest">
        <div class="chest-glow"></div>
        <div class="chest-lid"></div>
        <div class="chest-lock"></div>
        <div class="chest-body"></div>
      </div>
    </div>

    <div class="status-text" id="statusText">불러오는 중...</div>

    <div class="result-box" id="resultBox">
      <div class="rarity-badge" id="rarityBadge"></div>
      <div class="treasure-name" id="treasureName"></div>
      <div id="treasureDetail" style="font-size:13px; color:var(--ink-dim);"></div>
    </div>

    <div class="stats-row">
      <span class="label">누적 보물</span>
      <span class="value" id="totalTreasure">0</span>
    </div>

    <button class="collection-link" id="openCollectionBtn">📖 도감 보기</button>
  </div>

  <!-- 도감 화면 -->
  <div class="card hidden" id="collectionScreen">
    <div class="top-row">
      <h1 style="margin:0; font-size:20px;">도감</h1>
      <button id="backToGameBtn">← 돌아가기</button>
    </div>
    <p style="font-size:12px; color:var(--ink-dim); margin-top:-10px; margin-bottom:16px;">같은 아이템을 3개 모으면 한 등급 위 아이템으로 합성할 수 있어요</p>
    <div class="craft-result" id="craftResult"></div>
    <div class="collection-grid" id="collectionGrid"></div>
  </div>

<script>
  // ⚠️ 배포 후에는 실제 백엔드 서버 주소로 바꿔주세요.
  // 예: const API_BASE = 'https://box-game-api.onrender.com';
  const API_BASE = 'https://box-game-6y1g.onrender.com';

  // 배포된 사이트에서는 새로고침해도 로그인이 유지되도록 토큰을 localStorage에 저장합니다.
  let authToken = localStorage.getItem('boxGameToken');
  let currentUser = null;
  let statusInterval = null;

  const authScreen = document.getElementById('authScreen');
  const gameScreen = document.getElementById('gameScreen');
  const collectionScreen = document.getElementById('collectionScreen');
  const authError = document.getElementById('authError');

  // 페이지를 열자마자 저장된 토큰이 아직 유효한지 확인해서 자동 로그인 시도
  (async function tryAutoLogin(){
    if (!authToken) return;
    try {
      const res = await authFetch('/api/auth/me');
      if (!res.ok) throw new Error('토큰 만료');
      const data = await res.json();
      currentUser = data.user;
      enterGame();
    } catch (err) {
      // 토큰이 만료됐거나 유효하지 않으면 지우고 로그인 화면 유지
      localStorage.removeItem('boxGameToken');
      authToken = null;
    }
  })();

  const RARITY_LABEL = { common: '일반', rare: '희귀', epic: '영웅', legendary: '전설' };

  document.getElementById('openCollectionBtn').addEventListener('click', async () => {
    gameScreen.classList.add('hidden');
    collectionScreen.classList.remove('hidden');
    document.getElementById('craftResult').style.display = 'none';
    await loadCollection();
  });

  document.getElementById('backToGameBtn').addEventListener('click', () => {
    collectionScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
  });

  const CRAFT_COST = 3;

  async function loadCollection(showLoadingText = true){
    const grid = document.getElementById('collectionGrid');
    if (showLoadingText) {
      grid.innerHTML = '<p style="color:var(--ink-dim); font-size:13px;">불러오는 중...</p>';
    }

    try {
      const res = await authFetch('/api/box/collection');
      const data = await res.json();
      if (!res.ok) return;

      grid.innerHTML = '';
      data.collection.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.rarity} ${item.obtained ? '' : 'locked'}`;
        card.title = item.obtained ? item.flavor : '아직 발견하지 못한 아이템입니다';

        const canCraft = item.obtained && item.count >= CRAFT_COST && item.rarity !== 'legendary';

        card.innerHTML = `
          <span class="item-emoji">${item.obtained ? item.emoji : '❔'}</span>
          <div class="item-name">${item.obtained ? item.name : '???'}</div>
          ${item.obtained && item.count > 0 ? `<div class="item-count">x${item.count}</div>` : ''}
          ${canCraft ? `<button class="craft-btn" data-key="${item.key}">합성(-${CRAFT_COST})</button>` : ''}
        `;
        grid.appendChild(card);
      });

      // 합성 버튼 클릭 이벤트 연결
      grid.querySelectorAll('.craft-btn').forEach(btn => {
        btn.addEventListener('click', () => craftItem(btn.dataset.key, btn));
      });
    } catch (err) {
      grid.innerHTML = '<p style="color:var(--danger); font-size:13px;">불러오지 못했습니다.</p>';
    }
  }

  async function craftItem(itemKey, btnEl){
    btnEl.disabled = true;
    btnEl.textContent = '합성 중...';

    try {
      const res = await authFetch('/api/box/craft', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemKey }),
      });
      const data = await res.json();

      const craftResult = document.getElementById('craftResult');
      if (!res.ok) {
        craftResult.style.display = 'block';
        craftResult.style.color = 'var(--danger)';
        craftResult.textContent = data.message;
      } else {
        craftResult.style.display = 'block';
        craftResult.style.color = 'var(--ink)';
        craftResult.innerHTML = `${data.consumed.name} x${data.consumed.amount} <span class="arrow">→</span> ${data.result.emoji} ${data.result.name} 획득!`;
      }

      await loadCollection(false); // 로딩 문구 없이 조용히 갱신 (깜빡임 방지)
    } catch (err) {
      btnEl.disabled = false;
      btnEl.textContent = `합성(-${CRAFT_COST})`;
    }
  }

  function showAuthError(message){
    authError.textContent = message;
    authError.style.display = 'block';
  }
  function clearAuthError(){
    authError.style.display = 'none';
  }

  // 로그인 / 회원가입 폼 전환
  document.getElementById('switchToSignup').addEventListener('click', () => {
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('signupForm').classList.remove('hidden');
    document.getElementById('switchToSignupLine').classList.add('hidden');
    document.getElementById('switchToLoginLine').classList.remove('hidden');
    clearAuthError();
  });
  document.getElementById('switchToLogin').addEventListener('click', () => {
    document.getElementById('signupForm').classList.add('hidden');
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('switchToLoginLine').classList.add('hidden');
    document.getElementById('switchToSignupLine').classList.remove('hidden');
    clearAuthError();
  });

  // 회원가입 처리
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAuthError();
    const nickname = document.getElementById('signupNickname').value;
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;

    try {
      const res = await fetch(`${API_BASE}/api/auth/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, nickname }),
      });
      const data = await res.json();
      if (!res.ok) return showAuthError(data.message || '회원가입에 실패했습니다.');

      authToken = data.token;
      localStorage.setItem('boxGameToken', data.token);
      currentUser = data.user;
      enterGame();
    } catch (err) {
      showAuthError('서버에 연결할 수 없습니다.');
    }
  });

  // 로그인 처리
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAuthError();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) return showAuthError(data.message || '로그인에 실패했습니다.');

      authToken = data.token;
      localStorage.setItem('boxGameToken', data.token);
      currentUser = data.user;
      enterGame();
    } catch (err) {
      showAuthError('서버에 연결할 수 없습니다.');
    }
  });

  // 로그아웃
  document.getElementById('logoutBtn').addEventListener('click', () => {
    authToken = null;
    currentUser = null;
    localStorage.removeItem('boxGameToken');
    clearInterval(statusInterval);
    clearInterval(resyncInterval);
    gameScreen.classList.add('hidden');
    authScreen.classList.remove('hidden');
  });

  function enterGame(){
    document.getElementById('userNickname').textContent = currentUser.nickname || currentUser.email;
    authScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');

    refreshStatus(); // 최초 1회 서버에서 정확한 상태를 가져옴

    // 화면 갱신은 서버에 매번 묻지 않고, 로컬 시계로 0.2초마다 자체 계산합니다.
    // (네트워크 왕복 시간이 카운트다운 오차로 쌓이는 걸 막기 위함)
    clearInterval(statusInterval);
    statusInterval = setInterval(renderCountdown, 200);

    // 다만 오래 켜두면 로컬 시계가 아주 조금씩 어긋날 수 있으니,
    // 30초마다 한 번씩 서버와 다시 맞춥니다.
    clearInterval(resyncInterval);
    resyncInterval = setInterval(refreshStatus, 30000);
  }

  // 서버에 인증 토큰을 담아 요청하는 공통 함수
  async function authFetch(path, options = {}){
    return fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        ...(options.headers || {}),
        'Authorization': `Bearer ${authToken}`,
      },
    });
  }

  let cachedNextAvailableAt = null;
  let cachedCanOpen = false;
  let resyncInterval = null;
  // 서버 시각과 내 기기 시각의 차이(밀리초). 이 값을 더하면 "서버 기준 지금"을 알 수 있습니다.
  let serverTimeOffset = 0;
  let isOpening = false;

  function syncServerTime(serverTimeStr){
    serverTimeOffset = new Date(serverTimeStr).getTime() - Date.now();
  }

  function adjustedNow(){
    return new Date(Date.now() + serverTimeOffset);
  }

  // 서버에서 정확한 상태를 받아와 기준값을 갱신 (자주 호출하지 않음)
  async function refreshStatus(){
    try {
      const res = await authFetch('/api/box/status');
      const data = await res.json();
      if (!res.ok) return;

      syncServerTime(data.serverTime);
      document.getElementById('totalTreasure').textContent = data.totalTreasure;
      cachedNextAvailableAt = data.nextAvailableAt ? new Date(data.nextAvailableAt) : null;
      cachedCanOpen = data.canOpen;
      renderCountdown();
    } catch (err) {
      // 네트워크 문제는 조용히 무시하고 다음 동기화 때 재시도
    }
  }

  // 네트워크 요청 없이, 저장해둔 기준 시각만으로 화면을 그리는 함수 (0.2초마다 호출됨)
  function renderCountdown(){
    const statusText = document.getElementById('statusText');
    const chest = document.getElementById('chest');

    if (cachedCanOpen){
      statusText.textContent = '상자를 열 수 있습니다';
      statusText.classList.add('ready');
      chest.style.opacity = '1';
      chest.style.pointerEvents = isOpening ? 'none' : 'auto';
      return;
    }

    statusText.classList.remove('ready');
    chest.style.opacity = '0.6';
    chest.style.pointerEvents = 'none';

    if (!cachedNextAvailableAt) return;

    const remainingMs = cachedNextAvailableAt - adjustedNow();
    if (remainingMs <= 0){
      // 로컬 계산상 시간이 다 됐으면 즉시 열 수 있는 상태로 전환하고,
      // 확인 차 서버와 한 번 더 맞춰봅니다.
      cachedCanOpen = true;
      renderCountdown();
      refreshStatus();
      return;
    }

    const m = Math.floor(remainingMs / 60000);
    const s = Math.floor((remainingMs % 60000) / 1000);
    statusText.innerHTML = `다음 상자까지 <span class="timer">${m}분 ${s}초</span>`;
  }

  // 상자 클릭 → 실제 오픈 요청
  document.getElementById('chest').addEventListener('click', async function(){
    if (!cachedCanOpen || isOpening) return;

    isOpening = true;
    this.style.pointerEvents = 'none';

    try {
      const res = await authFetch('/api/box/open', { method: 'POST' });
      const data = await res.json();

      if (!res.ok){
        // 429 등 - 상태 새로고침으로 최신 타이머 반영
        isOpening = false;
        refreshStatus();
        return;
      }

      syncServerTime(data.serverTime);
      cachedNextAvailableAt = new Date(data.nextAvailableAt);
      cachedCanOpen = false;
      renderCountdown(); // 지연 없이 바로 카운트다운 시작

      this.classList.add('open');
      const rarityBadge = document.getElementById('rarityBadge');
      rarityBadge.textContent = RARITY_LABEL[data.treasure.rarity] || '';
      rarityBadge.className = `rarity-badge ${data.treasure.rarity}`;
      document.getElementById('treasureName').textContent = `${data.treasure.emoji} ${data.treasure.name}`;
      document.getElementById('treasureDetail').textContent = `+${data.treasure.amount} 획득`;
      document.getElementById('resultBox').style.display = 'block';
      document.getElementById('totalTreasure').textContent = data.totalTreasure;

      // 이건 순전히 상자가 닫히는 비주얼 애니메이션용 지연이고, 카운트다운과는 무관합니다.
      setTimeout(() => {
        this.classList.remove('open');
      }, 1500);
    } catch (err) {
      // 네트워크 실패 시 다시 시도할 수 있게 상태 복구
      refreshStatus();
    } finally {
      isOpening = false;
    }
  });
</script>
